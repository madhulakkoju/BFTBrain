network:
  server: 127.0.0.1:9020
  units:
    - 127.0.0.1:9021
    - 127.0.0.1:9022
    - 127.0.0.1:9023
    - 127.0.0.1:9024
    - 127.0.0.1:9025
general:
  f: 1
  max-active-requests: 1000
  verbosity: v
  logfile: true # true -> file, false -> stdout
  learning: true
  report-sequence: 250
  exchange-sequence: 300
benchmark:
  block-size: 40
  checkpoint-size: 500
  catch-up-k: 2
  request-interval-micros: 100
  benchmark-interval-ms: 30000
  timeout: fixed
  timeout-trigger-interval-ms: 50
  client: basic
  closed-loop:
    enable: true
    num-client: 100
    delay-ms: 0
  leader-rotate-interval: 100
  aggregation-delay-ms: 200
workload:
  # lower for more contention
  contention-level:
    advance: true
    init: 20
    delay: 0
    schedule:
      values:
        - 90
        - 100
        - 10
        - 80
        - 70
      intervals:
        - 580000
        - 570000
        - 600000
        - 590000
        - 560000
  dataset-size: 100
  payload:
    request-size: 1000000
    reply-size: 1000000
  compute-factor:
    advance: true
    init: 1000
    delay: 0
    schedule:
      values:
        - 100000
        - 100000
        - 1000000
        - 1500000
        - 10000
      intervals:
        - 560000
        - 600000
        - 590000
        - 570000
        - 580000
  distribution:
    - 1  # 00
    - 0  # 04
    - 0  # 40
    - 0  # 44
  read-only-ratio:
    advance: true
    init: 15
    delay: 0
    schedule:
      values:
        - 15
        - 30
        - 80
        - 20
        - 30
      intervals:
        - 570000
        - 590000
        - 580000
        - 560000
        - 600000
fault:
  in-dark:
    # the affected entities will always be excluded from leader rotation
    # set it to be a `non-existing` node (e.g., 100) to avoid this
    affected-entities:
      - 100
    generator:
      advance: true
      init: false
      delay: 10000
      schedule:
        values:
          - false
          # - true
        intervals:
          # - 10000
  timeout:
    affected-entities:
      - 200
    generator:
      advance: true
      init: 0
      delay: 10000
      fixed:
        value: 0
  slow-proposal:
    # affected entities here are the malicious leaders
    # instead of victims of malicious leaders
    affected-entities:
      - 100
    attacking: false
    timer: 100
    
switching:
  protocol-pool:
    - pbft
    - zyzzyva
    - hotstuff
    - cheapbft
    - sbft
    - prime
  architecture-pool:
    # - OX
    # - XOV
    # - XOV++
    - OXII
  # debug-sequence:
  #   - cheapbft
  #   - hotstuff
  #   - prime
  #   - zyzzyva
  #   - pbft
  #   - sbft
